---
# Dedicated Ollama + Nemotron inference host.
# Out-of-cluster; not a K3s node.

- name: Install prereqs
  become: true
  ansible.builtin.apt:
    name:
      - curl
      - ufw
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- Ollama ----------------------------------------------------------------

- name: Check if ollama is installed
  ansible.builtin.stat:
    path: /usr/local/bin/ollama
  register: ollama_bin

- name: Install Ollama (installer detects JetPack and pulls the correct GPU variant)
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://ollama.com/install.sh | sh
  args:
    executable: /bin/bash
  when: not ollama_bin.stat.exists
  changed_when: true

- name: Configure Ollama to bind to {{ ollama_host_bind }}
  become: true
  ansible.builtin.template:
    src: ollama-override.conf.j2
    dest: /etc/systemd/system/ollama.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart ollama

- name: Ensure systemd dropin dir exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    mode: '0755'

- name: Enable and start Ollama
  become: true
  ansible.builtin.systemd:
    name: ollama
    enabled: true
    state: started
    daemon_reload: true

- name: Pull Ollama models
  become: true
  ansible.builtin.command: "ollama pull {{ item }}"
  loop: "{{ ollama_models }}"
  register: ollama_pull
  changed_when: "'success' in ollama_pull.stdout or 'pulling' in ollama_pull.stdout"
  failed_when: ollama_pull.rc != 0

# --- Node exporter (upstream binary, avoids Debian 1.3.1 Jetson issues) -----

- name: Ensure node_exporter user exists
  become: true
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Check node_exporter binary
  ansible.builtin.stat:
    path: /usr/local/bin/node_exporter
  register: ne_bin

- name: Download + install node_exporter {{ node_exporter_version }}
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    cd /tmp
    curl -sL {{ node_exporter_url }} | tar xz
    mv node_exporter-{{ node_exporter_version }}.linux-arm64/node_exporter /usr/local/bin/node_exporter
    chmod +x /usr/local/bin/node_exporter
    rm -rf node_exporter-{{ node_exporter_version }}.linux-arm64
  args:
    executable: /bin/bash
  when: not ne_bin.stat.exists
  changed_when: true

- name: Install node_exporter systemd unit
  become: true
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: '0644'
  notify: restart node_exporter

- name: Enable + start node_exporter
  become: true
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

# --- ufw ---------------------------------------------------------------------

- name: ufw default deny incoming
  become: true
  community.general.ufw:
    direction: incoming
    policy: deny

- name: ufw default allow outgoing
  become: true
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: ufw allow SSH from LAN
  become: true
  community.general.ufw:
    rule: allow
    from_ip: "{{ lan_cidr }}"
    to_port: '22'
    proto: tcp

- name: ufw allow Ollama from LAN
  become: true
  community.general.ufw:
    rule: allow
    from_ip: "{{ lan_cidr }}"
    to_port: '11434'
    proto: tcp

- name: ufw allow node_exporter from LAN
  become: true
  community.general.ufw:
    rule: allow
    from_ip: "{{ lan_cidr }}"
    to_port: '9100'
    proto: tcp

- name: ufw enable
  become: true
  community.general.ufw:
    state: enabled

# --- SSH hardening ---------------------------------------------------------

- name: SSH password auth off
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  notify: restart ssh

- name: SSH root login off
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
  notify: restart ssh

# --- Unattended upgrades ---------------------------------------------------

- name: Enable unattended-upgrades
  become: true
  ansible.builtin.shell: |
    dpkg-reconfigure -f noninteractive unattended-upgrades
  changed_when: false
