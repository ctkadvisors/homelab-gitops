---
# Firewall configuration tasks

- name: Install UFW
  apt:
    name: ufw
    state: present
  tags: firewall

- name: Reset UFW to defaults
  ufw:
    state: reset
  tags: firewall

- name: Set UFW default policies
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }
    - { direction: 'routed', policy: 'deny' }
  tags: firewall

- name: Allow SSH access
  ufw:
    rule: allow
    port: '22'
    proto: tcp
    comment: 'SSH access'
  tags: firewall

- name: Allow configured ports
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    comment: 'Configured port'
  loop: "{{ firewall_config.allowed_ports }}"
  when: item != '22'  # SSH already configured above
  tags: firewall

- name: Allow cluster communication
  ufw:
    rule: allow
    src: "{{ network.cluster_network }}"
    comment: 'K3s cluster communication'
  tags: firewall

- name: Enable UFW
  ufw:
    state: enabled
    logging: 'on'
  tags: firewall

- name: Display firewall status
  command: ufw status verbose
  register: ufw_status
  changed_when: false
  tags: firewall

- name: Show firewall configuration
  debug:
    var: ufw_status.stdout_lines
  tags: firewall
