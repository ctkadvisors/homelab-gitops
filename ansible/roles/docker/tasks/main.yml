---
# Main tasks for docker role

- name: Include OS-specific variables
  include_vars: "{{ ansible_os_family }}.yml"
  tags: always

- name: Display Docker installation information
  debug:
    msg:
      - "Installing Docker on {{ inventory_hostname }}"
      - "Docker version: {{ docker.version }}"
      - "NVIDIA runtime enabled: {{ nvidia_runtime.enabled }}"
  tags: always

# Prerequisites
- name: Install Docker prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
    state: present
    update_cache: yes
  tags: docker

- name: Load kernel modules for Docker
  modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ container_optimizations.kernel_modules }}"
  tags: docker

- name: Ensure kernel modules are loaded at boot
  lineinfile:
    path: /etc/modules-load.d/docker.conf
    line: "{{ item }}"
    create: yes
  loop: "{{ container_optimizations.kernel_modules }}"
  tags: docker

# Docker Repository Setup
- name: Add Docker GPG key
  apt_key:
    url: "{{ docker.repo.gpg_key }}"
    state: present
  tags: docker

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch={{ ansible_architecture }}] {{ docker.repo.url }} {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes
  tags: docker

# Docker Installation
- name: Install Docker packages
  apt:
    name:
      - "docker-{{ docker.edition }}"
      - "docker-{{ docker.edition }}-cli"
      - "containerd.io"
      - "docker-buildx-plugin"
      - "docker-compose-plugin"
    state: "{{ 'latest' if docker.version == 'latest' else 'present' }}"
    update_cache: yes
  notify: restart docker
  tags: docker

# Docker Configuration
- name: Create Docker daemon configuration directory
  file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: docker

- name: Configure Docker daemon
  template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    backup: yes
  notify: restart docker
  tags: docker

# User Management
- name: Add users to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker.users }}"
  tags: docker

# NVIDIA Container Runtime (for GPU nodes)
- name: Install NVIDIA Container Runtime
  include_tasks: nvidia_runtime.yml
  when: nvidia_runtime.enabled
  tags: nvidia

# System Configuration
- name: Configure sysctl parameters for containers
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop: "{{ container_optimizations.sysctl_params | dict2items }}"
  tags: docker

- name: Configure system limits for Docker
  pam_limits:
    domain: "{{ ansible_user }}"
    limit_type: "{{ item.type }}"
    limit_item: "{{ item.item }}"
    value: "{{ item.value }}"
  loop:
    - { type: 'soft', item: 'nofile', value: "{{ container_optimizations.limits.nofile }}" }
    - { type: 'hard', item: 'nofile', value: "{{ container_optimizations.limits.nofile }}" }
    - { type: 'soft', item: 'nproc', value: "{{ container_optimizations.limits.nproc }}" }
    - { type: 'hard', item: 'nproc', value: "{{ container_optimizations.limits.nproc }}" }
  tags: docker

# Service Management
- name: Enable and start Docker service
  systemd:
    name: docker
    enabled: "{{ docker.service.enabled }}"
    state: "{{ docker.service.state }}"
    daemon_reload: yes
  tags: docker

- name: Enable and start containerd service
  systemd:
    name: containerd
    enabled: yes
    state: started
    daemon_reload: yes
  tags: docker

# Cleanup Configuration
- name: Set up Docker cleanup cron job
  cron:
    name: "Docker system cleanup"
    job: "/usr/bin/docker system prune -af --volumes"
    minute: "0"
    hour: "3"
    day: "*"
    month: "*"
    weekday: "0"
    user: root
  when: cleanup.enabled
  tags: docker

# Verification
- name: Verify Docker installation
  command: docker --version
  register: docker_version_output
  changed_when: false
  tags: docker

- name: Verify Docker service status
  command: systemctl is-active docker
  register: docker_service_status
  changed_when: false
  tags: docker

- name: Test Docker functionality
  docker_container:
    name: docker_test
    image: hello-world
    state: started
    auto_remove: yes
    detach: no
  become_user: "{{ ansible_user }}"
  register: docker_test_result
  tags: docker

- name: Display Docker installation results
  debug:
    msg:
      - "Docker version: {{ docker_version_output.stdout }}"
      - "Docker service: {{ docker_service_status.stdout }}"
      - "Docker test: {{ 'PASSED' if docker_test_result is succeeded else 'FAILED' }}"
  tags: docker
