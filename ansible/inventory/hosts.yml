---
# Local AI Homelab Ansible Inventory
# This inventory defines all nodes in the K3s cluster

all:
  children:
    k3s_cluster:
      children:
        k3s_masters:
          hosts:
            elitemini:
              ansible_host: 10.0.0.76
              ansible_user: chris
              ansible_ssh_private_key_file: ~/.ssh/id_ed25519
              # Node-specific variables
              node_role: master
              node_type: control-plane
              k3s_server: true
              k3s_agent: false
              # Hardware specifications (upgraded)
              cpu_cores: 12
              memory_gb: 32
              architecture: x86_64
              gpu_enabled: true
              gpu_type: amd
              # Services to run on this node (control plane)
              services:
                - monitoring
                - postgresql
                - cluster-management
                - backup-services
                - traefik

        k3s_workers:
          hosts:
            jetson2:
              ansible_host: 10.0.0.75
              ansible_user: chris
              ansible_ssh_private_key_file: ~/.ssh/id_rsa
              # Node-specific variables
              node_role: worker
              node_type: gpu-worker
              k3s_server: false
              k3s_agent: true
              # Hardware specifications
              cpu_cores: 6
              memory_gb: 8
              architecture: arm64
              gpu_enabled: true
              gpu_type: nvidia
              # Services to run on this node
              services:
                - qdrant
              # Optional node - may not be available
              optional: true

            elitemini2:
              # Static .58 host-side since 2026-08-12 (config/network.yaml);
              # .74, .66 and .64 were DHCP drift and now belong to other devices.
              ansible_host: 10.0.0.58
              ansible_user: chris
              ansible_ssh_private_key_file: ~/.ssh/id_ed25519
              # Node-specific variables
              node_role: worker
              node_type: compute-worker
              k3s_server: false
              k3s_agent: true
              # Hardware specifications
              cpu_cores: 12
              memory_gb: 60
              architecture: x86_64
              gpu_enabled: true
              gpu_type: amd
              # Services to run on this node (high-memory workloads)
              services:
                - n8n
                - platform-api
                - platform-dashboard
                - openwebui
              # Performance optimizations
              performance_mode: true
              high_memory: true

    # Storage nodes (if using external NFS)
    storage_nodes:
      hosts:
        synology-nas:
          ansible_host: 192.168.131.100
          ansible_user: admin
          # NFS configuration
          nfs_enabled: true
          nfs_exports:
            - path: /volume1/k8s-storage
              clients: "192.168.131.0/24"
              options: "rw,sync,no_subtree_check,no_root_squash"
          # Optional - may not be managed by Ansible
          ansible_connection: local
          optional: true

# Group variables for all K3s nodes
k3s_cluster:
  vars:
    # K3s cluster configuration
    k3s_version: "v1.32.5+k3s1"
    k3s_cluster_domain: "homelab"
    k3s_cluster_cidr: "10.42.0.0/16"
    k3s_service_cidr: "10.43.0.0/16"
    k3s_cluster_dns: "10.43.0.10"

    # Network configuration
    cluster_network: "192.168.131.0/24"
    metallb_ip_range: "192.168.131.200-192.168.131.210"

    # Container runtime
    container_runtime: containerd

    # Common directories
    k3s_config_dir: "/etc/rancher/k3s"
    k3s_data_dir: "/var/lib/rancher/k3s"

    # SSL/TLS configuration
    ssl_cert_dir: "/opt/ssl-certs"

    # Backup configuration
    backup_dir: "/opt/backups"

    # Monitoring
    monitoring_enabled: true

    # DNS configuration
    dns_domain: "homelab"
    dns_server: "192.168.131.111"

# Master node specific variables
k3s_masters:
  vars:
    # K3s master configuration
    k3s_disable_components:
      - traefik # We'll install our own
      - servicelb # Using MetalLB instead
      - local-storage # Using NFS/hostPath

    k3s_extra_args:
      - "--cluster-domain={{ k3s_cluster_domain }}"
      - "--disable=traefik"
      - "--disable=servicelb"
      - "--disable=local-storage"
      - "--write-kubeconfig-mode=644"
      - "--bind-address=0.0.0.0"

    # Data directories on master
    data_directories:
      - path: "/opt/openwebui-data"
        owner: "chris"
        group: "chris"
        mode: "0755"
      - path: "/opt/n8n-data"
        owner: "chris"
        group: "chris"
        mode: "0755"
      - path: "/opt/mcpo-data"
        owner: "chris"
        group: "chris"
        mode: "0755"

# Worker node specific variables
k3s_workers:
  vars:
    # K3s agent configuration
    k3s_extra_args:
      - "--node-label=node-type={{ node_type }}"

    # Data directories on workers
    data_directories:
      - path: "/opt/ollama-models"
        owner: "chris"
        group: "chris"
        mode: "0755"

# GPU-enabled worker nodes
gpu_workers:
  hosts:
    jetson2:
  vars:

# Out-of-cluster dedicated Nemotron inference hosts.
# Not K3s agents. Managed by ansible/roles/nemotron-host/.
nemotron_hosts:
  hosts:
    jetson1:
      ansible_host: 10.0.0.73
      ansible_user: chris
      ansible_ssh_private_key_file: ~/.ssh/id_rsa
      node_role: inference-host
      cpu_cores: 6
      memory_gb: 8
      architecture: arm64
      gpu_enabled: true
      gpu_type: nvidia
      services:
        - ollama
        - nemotron-3-nano

# High-performance compute worker nodes
compute_workers:
  hosts:
    elitemini2:
  vars:
    # AMD GPU runtime configuration
    amd_gpu_enabled: true
    rocm_version: "latest"

    # Compute-specific K3s labels
    k3s_extra_args:
      - "--node-label=node-type={{ node_type }}"
      - "--node-label=amd.com/gpu=true"
      - "--node-label=gpu-type={{ gpu_type }}"
      - "--node-label=compute-intensive=true"

    # Performance optimizations for x86_64
    performance_mode: "high-performance"
    cpu_governor: "performance"

    # Data directories on compute workers
    data_directories:
      - path: "/opt/monitoring-data"
        owner: "chris"
        group: "chris"
        mode: "0755"
      - path: "/opt/automation-data"
        owner: "chris"
        group: "chris"
        mode: "0755"
      - path: "/opt/vector-db-data"
        owner: "chris"
        group: "chris"
        mode: "0755"
      - path: "/opt/backup-data"
        owner: "chris"
        group: "chris"
        mode: "0755"
