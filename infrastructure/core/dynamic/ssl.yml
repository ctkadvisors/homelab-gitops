# Dynamic SSL Configuration for Traefik
# This file configures SSL/TLS certificates and redirects

http:
  # Global HTTP to HTTPS redirect
  middlewares:
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

    # Security headers
    security-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - OPTIONS
          - PUT
          - POST
          - DELETE
        accessControlMaxAge: 100
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        referrerPolicy: "same-origin"
        sslRedirect: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        customRequestHeaders:
          X-Forwarded-Proto: "https"

  # HTTP routers (redirect to HTTPS) - DISABLED: Using static redirect in traefik.yml instead
  # routers:
  #   http-catchall:
  #     rule: "hostregexp(`{host:.+}`)"
  #     entrypoints:
  #       - web
  #     middlewares:
  #       - https-redirect
  #     service: api@internal

tls:
  # Certificate configuration
  certificates:
    - certFile: /certs/local.crt
      keyFile: /certs/local.key
      stores:
        - default

  stores:
    default:
      defaultCertificate:
        certFile: /certs/local.crt
        keyFile: /certs/local.key

  options:
    default:
      minVersion: "VersionTLS12"
      maxVersion: "VersionTLS13"
      cipherSuites:
        - "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
        - "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"
        - "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
        - "TLS_RSA_WITH_AES_256_GCM_SHA384"
        - "TLS_RSA_WITH_AES_128_GCM_SHA256"
