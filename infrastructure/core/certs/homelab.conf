[req]
default_bits = 2048
prompt = no
default_md = sha256
distinguished_name = dn
req_extensions = v3_req

[dn]
C=US
ST=Local
L=Local
O=LocalAI
OU=Development
CN=*.homelab

[v3_req]
basicConstraints = CA:FALSE
keyUsage = nonRepudiation, digitalSignature, keyEncipherment
subjectAltName = @alt_names

[alt_names]
DNS.1 = *.homelab
DNS.2 = homelab
DNS.3 = chat.homelab
DNS.4 = n8n.homelab
DNS.5 = neo4j.homelab
DNS.6 = mcpo.homelab
DNS.7 = mcpo-ui.homelab
DNS.8 = ollama.homelab
DNS.9 = n8n-mcp.homelab
DNS.10 = dockploy.homelab
DNS.11 = grafana.homelab
DNS.12 = prometheus.homelab
