[req]
default_bits = 2048
prompt = no
default_md = sha256
distinguished_name = dn
req_extensions = v3_req

[dn]
C=US
ST=Local
L=Local
O=LocalAI
OU=Development
CN=*.local

[v3_req]
basicConstraints = CA:FALSE
keyUsage = nonRepudiation, digitalSignature, keyEncipherment
subjectAltName = @alt_names

[alt_names]
DNS.1 = *.local
DNS.2 = local
DNS.3 = chat.local
DNS.4 = n8n.local
DNS.5 = neo4j.local
DNS.6 = mcpo.local
DNS.7 = ollama.local
DNS.8 = dockploy.local
DNS.9 = grafana.local
DNS.10 = prometheus.local
