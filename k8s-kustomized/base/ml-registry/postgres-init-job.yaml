apiVersion: batch/v1
kind: Job
metadata:
  name: mlflow-postgres-init-2
  namespace: ml-registry
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: postgresql.database.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-pg-admin
                  key: password
            - name: MLFLOW_ROLE_PW
              valueFrom:
                secretKeyRef:
                  name: mlflow-pg-admin
                  key: mlflow-role-password
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do sleep 3; done
              psql -v ON_ERROR_STOP=1 -v pw="$MLFLOW_ROLE_PW" -d postgres <<'SQL'
              SELECT format('CREATE ROLE mlflow LOGIN PASSWORD %L', :'pw')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname='mlflow')\gexec
              SELECT format('ALTER ROLE mlflow LOGIN PASSWORD %L', :'pw')\gexec
              SELECT 'CREATE DATABASE mlflow OWNER mlflow'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='mlflow')\gexec
              SQL
              echo "mlflow db + role ready (password set)"
