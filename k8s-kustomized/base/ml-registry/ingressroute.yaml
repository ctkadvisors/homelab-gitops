apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mlflow-ingress
  namespace: ml-registry
  labels:
    app: mlflow
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mlflow.example.com`)
      kind: Rule
      services:
        - name: mlflow
          port: 5000
  tls:
    secretName: example-tls
