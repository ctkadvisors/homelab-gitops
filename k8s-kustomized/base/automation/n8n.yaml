---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: automation
  labels:
    app: n8n
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: workflow-automation
    app.kubernetes.io/part-of: local-ai-homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
        app.kubernetes.io/name: n8n
        app.kubernetes.io/component: workflow-automation
    spec:
      nodeSelector:
        high-memory: "true"
      containers:
        - name: n8n
          image: n8nio/n8n:2.2.4
          ports:
            - containerPort: 5678
              name: http
          env:
            - name: N8N_HOST
              value: "0.0.0.0"
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: "http"
            - name: NODE_ENV
              value: "production"
            - name: WEBHOOK_URL
              value: "https://n8n.example.com"
            # LocalAI OpenAI-compatible API
            - name: OPENAI_API_BASE_URL
              value: "http://localai.ai-services.svc.cluster.local:8080/v1"
            - name: OPENAI_API_KEY
              value: "sk-localai"
            - name: GENERIC_TIMEZONE
              value: "America/Los_Angeles"
            - name: N8N_LOG_LEVEL
              value: "info"
            - name: N8N_METRICS
              value: "true"
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_VERSION_NOTIFICATIONS_ENABLED
              value: "false"
            - name: N8N_TEMPLATES_ENABLED
              value: "true"
            - name: N8N_ONBOARDING_FLOW_DISABLED
              value: "false"
            - name: N8N_PERSONALIZATION_ENABLED
              value: "true"
            - name: N8N_USER_MANAGEMENT_DISABLED
              value: "false"
            # Qdrant vector database for RAG workflows
            - name: QDRANT_URL
              value: "http://qdrant.vector-db.svc.cluster.local:6333"
            # kagent fleet — consumed by the KagentAgent custom node
            # (n8n-kagent-node.yaml). The node discovers agents live
            # from this API; nothing agent-specific is configured here.
            - name: KAGENT_WORKBENCH_URL
              value: "http://kagent-workbench.kagent-system.svc.cluster.local"
            - name: N8N_CUSTOM_EXTENSIONS
              value: "/home/node/.n8n/custom"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            - name: kagent-node
              mountPath: /home/node/.n8n/custom
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          hostPath:
            path: /opt/n8n-data
            type: DirectoryOrCreate
        - name: kagent-node
          configMap:
            name: n8n-kagent-node
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: automation
  labels:
    app: n8n
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: workflow-automation
spec:
  selector:
    app: n8n
  ports:
    - port: 5678
      targetPort: 5678
      name: http
  type: ClusterIP
