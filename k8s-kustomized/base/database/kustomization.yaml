---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: database-base
  annotations:
    config.kubernetes.io/local-config: "true"
    description: "PostgreSQL database with pgvector for all services"

resources:
  - namespace.yaml
  - postgresql.yaml
  - postgresql-init.yaml
  - pgadmin.yaml
  - redis-insight.yaml
  - neo4j.yaml
  - neo4j-auth-sealed.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: local-ai-homelab
      app.kubernetes.io/managed-by: kustomize
      component: database

commonAnnotations:
  config.kubernetes.io/origin: |
    path: k8s-kustomized/base/database/kustomization.yaml

images:
  - name: pgvector/pgvector
    newTag: pg16
