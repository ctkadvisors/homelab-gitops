# RedisInsight - Web-based Redis GUI
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-insight
  namespace: database
  labels:
    app: redis-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-insight
  template:
    metadata:
      labels:
        app: redis-insight
    spec:
      nodeSelector:
        high-memory: "true"
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - "mkdir -p /data/logs && chown -R 1000:1000 /data && chmod -R 755 /data"
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsUser: 0
      containers:
        - name: redis-insight
          image: redis/redisinsight:2.64
          ports:
            - containerPort: 5540
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5540
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5540
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          hostPath:
            path: /opt/redis-insight-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: redis-insight
  namespace: database
  labels:
    app: redis-insight
spec:
  selector:
    app: redis-insight
  ports:
    - port: 5540
      targetPort: 5540
      name: http
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redis-insight-ingress
  namespace: database
  labels:
    app: redis-insight
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`redis.example.com`)
      kind: Rule
      services:
        - name: redis-insight
          port: 5540
  tls:
    secretName: example-tls

