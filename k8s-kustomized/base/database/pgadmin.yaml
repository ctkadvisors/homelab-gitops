# pgAdmin - Web-based PostgreSQL administration tool
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers-config
  namespace: database
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "Homelab PostgreSQL",
          "Group": "Homelab",
          "Host": "postgresql.database.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "postgres",
          "Username": "postgres",
          "PassFile": "/tmp/pgpassfile",
          "SSLMode": "prefer",
          "Favorite": true
        }
      }
    }
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: database
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      nodeSelector:
        high-memory: "true"
      securityContext:
        fsGroup: 5050
        runAsUser: 5050
        runAsGroup: 5050
      initContainers:
        - name: fix-permissions
          image: busybox:1.35
          command:
            - sh
            - -c
            - "chown -R 5050:5050 /var/lib/pgadmin && chmod -R 755 /var/lib/pgadmin"
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
          securityContext:
            runAsUser: 0
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: pgadmin-secrets
                  key: email
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgadmin-secrets
                  key: password
            - name: PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION
              value: "True"
            - name: PGADMIN_CONFIG_LOGIN_BANNER
              value: "'Homelab PostgreSQL Administration'"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
            - name: servers-config
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            - name: pgpass-config
              mountPath: /tmp/pgpassfile
              subPath: pgpassfile
              readOnly: true
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          hostPath:
            path: /opt/pgadmin-data
            type: DirectoryOrCreate
        - name: servers-config
          configMap:
            name: pgadmin-servers-config
        - name: pgpass-config
          secret:
            secretName: pgadmin-pgpass
            defaultMode: 0600
---

apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: database
  labels:
    app: pgadmin
spec:
  selector:
    app: pgadmin
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP
---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pgadmin-ingress
  namespace: database
  labels:
    app: pgadmin
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pgadmin.example.com`)
      kind: Rule
      services:
        - name: pgadmin
          port: 80
  tls:
    secretName: example-tls

