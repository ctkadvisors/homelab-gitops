---
# PostgreSQL initialization scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init-scripts
  namespace: database
data:
  01-init.sql: |
    -- PostgreSQL initialization script
    -- Creates databases and extensions for all services

    -- Enable required extensions in main database
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS pgjwt;

    -- Create databases for services
    CREATE DATABASE openwebui;
    CREATE DATABASE openwebui_vector;  -- Separate database for vector storage
    CREATE DATABASE mcpo;
    CREATE DATABASE n8n;
    CREATE DATABASE supabase;  -- For Supabase backend
    CREATE DATABASE graphiti;
    CREATE DATABASE platform;  -- For Next.js Platform
    CREATE DATABASE gitea;     -- For Gitea Git hosting
    CREATE DATABASE doc_ingester; -- For Doc Ingester service

    -- Create users for each service
    CREATE USER openwebui WITH PASSWORD 'REDACTED';
    CREATE USER mcpo WITH PASSWORD 'REDACTED';
    CREATE USER n8n WITH PASSWORD 'REDACTED';
    CREATE USER supabase WITH PASSWORD 'REDACTED';
    CREATE USER dokploy WITH PASSWORD 'REDACTED';
    CREATE USER graphiti WITH PASSWORD 'REDACTED';
    CREATE USER platform WITH PASSWORD 'REDACTED';
    CREATE USER gitea WITH PASSWORD 'REDACTED';
    CREATE USER doc_ingester WITH PASSWORD 'REDACTED';

    -- Grant database ownership
    ALTER DATABASE openwebui OWNER TO openwebui;
    ALTER DATABASE openwebui_vector OWNER TO openwebui;
    ALTER DATABASE mcpo OWNER TO mcpo;
    ALTER DATABASE n8n OWNER TO n8n;
    ALTER DATABASE supabase OWNER TO supabase;
    ALTER DATABASE dokploy OWNER TO dokploy;
    ALTER DATABASE graphiti OWNER TO graphiti;
    ALTER DATABASE platform OWNER TO platform;
    ALTER DATABASE gitea OWNER TO gitea;
    ALTER DATABASE doc_ingester OWNER TO doc_ingester;

  02-setup-openwebui.sql: |
    \c openwebui
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    -- Grant schema permissions
    GRANT ALL ON SCHEMA public TO openwebui;
    GRANT ALL ON ALL TABLES IN SCHEMA public TO openwebui;
    GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO openwebui;
    GRANT ALL ON ALL FUNCTIONS IN SCHEMA public TO openwebui;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO openwebui;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO openwebui;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO openwebui;

    \c openwebui_vector
    CREATE EXTENSION IF NOT EXISTS vector;
    -- Grant schema permissions
    GRANT ALL ON SCHEMA public TO openwebui;
    GRANT ALL ON ALL TABLES IN SCHEMA public TO openwebui;
    GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO openwebui;
    GRANT ALL ON ALL FUNCTIONS IN SCHEMA public TO openwebui;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO openwebui;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO openwebui;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO openwebui;

