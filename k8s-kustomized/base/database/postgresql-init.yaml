  05-setup-supabase.sql: |
    \c supabase
    -- Supabase required extensions
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS pgjwt;
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE EXTENSION IF NOT EXISTS pgsodium;

    -- Create Supabase schemas
    CREATE SCHEMA IF NOT EXISTS auth;
    CREATE SCHEMA IF NOT EXISTS storage;
    CREATE SCHEMA IF NOT EXISTS realtime;
    CREATE SCHEMA IF NOT EXISTS supabase_functions;
    CREATE SCHEMA IF NOT EXISTS extensions;

    -- Grant schema permissions
    GRANT ALL ON SCHEMA public TO supabase;
    GRANT ALL ON SCHEMA auth TO supabase;
    GRANT ALL ON SCHEMA storage TO supabase;
    GRANT ALL ON SCHEMA realtime TO supabase;
    GRANT ALL ON SCHEMA supabase_functions TO supabase;
    GRANT ALL ON SCHEMA extensions TO supabase;

    GRANT ALL ON ALL TABLES IN SCHEMA public TO supabase;
    GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO supabase;
    GRANT ALL ON ALL FUNCTIONS IN SCHEMA public TO supabase;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO supabase;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO supabase;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO supabase;

    -- Create anon and authenticated roles for Supabase
    CREATE ROLE anon NOLOGIN;
    CREATE ROLE authenticated NOLOGIN;
    CREATE ROLE service_role NOLOGIN;

    -- Grant basic permissions
    GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
    GRANT ALL ON SCHEMA public TO service_role;

