# Neo4j Graph Database - GraphRAG "brain" (pairs with Qdrant on elitemini2)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: database
  labels:
    app: neo4j
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/component: graph-database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      # the neo4j Service's injected NEO4J_PORT_* link vars get parsed as
      # config by the entrypoint and fail strict validation
      enableServiceLinks: false
      # ponytail: co-located with qdrant (hostPath data) — the GraphRAG pair lives on one node
      nodeSelector:
        kubernetes.io/hostname: elitemini2
      securityContext:
        fsGroup: 7474
      # hostPath dirs are created root-owned; chown once so the main
      # container can run as the unprivileged neo4j user
      initContainers:
        - name: init-chown
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 7474:7474 /data"]
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
      containers:
        - name: neo4j
          image: neo4j:5.26-community
          securityContext:
            runAsUser: 7474
            runAsGroup: 7474
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: NEO4J_AUTH
            # no APOC: mcp-neo4j-cypher doesn't need it, and apoc.load.*
            # is an SSRF vector for prompt-injected agents. Add back with
            # a procedure allowlist when a tool actually requires it.
            - name: NEO4J_server_memory_heap_initial__size
              value: "512m"
            - name: NEO4J_server_memory_heap_max__size
              value: "2g"
            - name: NEO4J_server_memory_pagecache_size
              value: "1g"
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: neo4j-data
          hostPath:
            path: /opt/neo4j-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: database
  labels:
    app: neo4j
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/component: graph-database
spec:
  selector:
    app: neo4j
  ports:
    - port: 7474
      targetPort: 7474
      name: http
    - port: 7687
      targetPort: 7687
      name: bolt
      # bolt exposed on every node at :30687 so off-cluster clients (Mac MCP, jetson agents) can reach it.
      # ponytail: bolt is cleartext on the trusted home LAN — accepted; upgrade path is
      # cert-manager-issued TLS on 7687 (or ClusterIP + tailscale) if the LAN trust changes
      nodePort: 30687
  type: NodePort
