apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: buildkit-infrastructure
  annotations:
    description: "BuildKit infrastructure for v0.dev clone build pipeline"

resources:
- namespace.yaml
- serviceaccount.yaml  
- rbac.yaml
- docker-registry-secret.yaml

# Common labels for all resources
commonLabels:
  app: buildkit-infrastructure
  version: v1.0.0
  managed-by: kustomize

# Namespace all resources
namespace: platform-builds