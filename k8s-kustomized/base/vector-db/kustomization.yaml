---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: vector-db-base
  annotations:
    config.kubernetes.io/local-config: "true"
    description: "Vector Database services (Qdrant)"

resources:
  - namespace.yaml
  - qdrant.yaml
  - qdrant-init-job.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: local-ai-homelab
      app.kubernetes.io/managed-by: kustomize
      component: vector-db

commonAnnotations:
  config.kubernetes.io/origin: |
    path: k8s-kustomized/base/vector-db/kustomization.yaml

images:
  - name: qdrant/qdrant
    newTag: latest
