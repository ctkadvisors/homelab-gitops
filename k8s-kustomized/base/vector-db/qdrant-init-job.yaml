---
apiVersion: batch/v1
kind: Job
metadata:
  name: qdrant-init-collections
  namespace: vector-db
  labels:
    app: qdrant-init
    app.kubernetes.io/name: qdrant-init
    app.kubernetes.io/component: initialization
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: qdrant-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-qdrant
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -q -O- http://qdrant.vector-db.svc.cluster.local:6333/healthz; do echo waiting for qdrant; sleep 5; done']
      containers:
        - name: init-collections
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              echo "Creating homelab_docs collection..."
              curl -s -X PUT "http://qdrant.vector-db.svc.cluster.local:6333/collections/homelab_docs" \
                -H "Content-Type: application/json" \
                -d '{
                  "vectors": {
                    "size": 768,
                    "distance": "Cosine"
                  },
                  "optimizers_config": {
                    "default_segment_number": 2
                  },
                  "replication_factor": 1
                }' || true
              echo "Collection creation complete"
              # Verify
              curl -s "http://qdrant.vector-db.svc.cluster.local:6333/collections/homelab_docs" | head -c 200
              echo ""

              echo "Creating personal_docs collection..."
              curl -s -X PUT "http://qdrant.vector-db.svc.cluster.local:6333/collections/personal_docs" \
                -H "Content-Type: application/json" \
                -d '{
                  "vectors": {
                    "size": 768,
                    "distance": "Cosine"
                  },
                  "optimizers_config": {
                    "default_segment_number": 2
                  },
                  "replication_factor": 1
                }' || true
              echo "personal_docs collection creation complete"
              # Verify
              curl -s "http://qdrant.vector-db.svc.cluster.local:6333/collections/personal_docs" | head -c 200
              echo ""
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
