---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: gitea-base
  annotations:
    config.kubernetes.io/local-config: "true"
    description: "Gitea Git hosting and container registry"

# Resources to include
resources:
  - namespace.yaml
  - gitea.yaml

# Common labels applied to all resources
labels:
  - pairs:
      app.kubernetes.io/part-of: homelab-apps
      app.kubernetes.io/managed-by: kustomize
      component: gitea

# Common annotations
commonAnnotations:
  config.kubernetes.io/origin: |
    path: k8s-kustomized/base/gitea/kustomization.yaml

# Images to use
images:
  - name: gitea/gitea
    newTag: 1.22.3
