---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: homepage-dashboard
  annotations:
    config.kubernetes.io/local-config: "true"
    description: "Homepage Dashboard - Modern homelab dashboard with service discovery"

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress-route.yaml

labels:
  - pairs:
      app: homepage
      app.kubernetes.io/name: homepage
      app.kubernetes.io/component: dashboard
