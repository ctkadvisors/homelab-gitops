---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-ingress
  namespace: dashboard
  labels:
    app: homepage
    app.kubernetes.io/name: homepage
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dashboard.example.com`)
      kind: Rule
      services:
        - name: homepage
          port: 3000
  tls:
    secretName: example-tls
