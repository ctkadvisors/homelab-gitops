          "id": 3,
          "options": {
            "showHeader": true
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"project-.*\"}[5m])) by (namespace)",
              "format": "table",
              "instant": true,
              "interval": "",
              "legendFormat": "",
              "refId": "A"
            },
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=~\"project-.*\"}) by (namespace)",
              "format": "table",
              "instant": true,
              "interval": "",
              "legendFormat": "",
              "refId": "B"
            },
            {
              "expr": "count(kube_pod_info{namespace=~\"project-.*\"}) by (namespace)",
              "format": "table",
              "instant": true,
              "interval": "",
              "legendFormat": "",
              "refId": "C"
            }
          ],
          "title": "Project Resource Summary",
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {},
                "renameByName": {
                  "Value #A": "CPU Cores",
                  "Value #B": "Memory",
                  "Value #C": "Pods",
                  "namespace": "Project Namespace"
                }
              }
            }
