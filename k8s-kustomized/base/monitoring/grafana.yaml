---

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus:9090
      access: proxy
      isDefault: true
      editable: true
      uid: prometheus
      jsonData:
        timeInterval: 15s
        queryTimeout: 60s
        httpMethod: POST
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kubernetes
  namespace: monitoring
data:
  kubernetes-cluster.json: |
    {
      "id": null,
      "title": "Kubernetes Cluster Overview",
      "tags": ["kubernetes"],
      "style": "dark",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "id": 1,
          "title": "CPU Usage by Node",
          "type": "stat",
          "targets": [
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\", instance=~\".*elitemini.*\"}[5m])) * 100)",
              "refId": "A",
              "legendFormat": "elitemini",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\", instance=~\".*elitemini2.*\"}[5m])) * 100)",
              "refId": "B",
              "legendFormat": "elitemini2",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\", instance=~\".*jetson1.*\"}[5m])) * 100)",
              "refId": "C",
              "legendFormat": "jetson1",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\", instance=~\".*jetson2.*\"}[5m])) * 100)",
              "refId": "D",
              "legendFormat": "jetson2",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 70},
                  {"color": "red", "value": 90}
                ]
              }
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "title": "Memory Usage by Node",
          "type": "stat",
          "targets": [
            {
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes{instance=~\".*elitemini.*\"} / node_memory_MemTotal_bytes{instance=~\".*elitemini.*\"}))",
              "refId": "A",
              "legendFormat": "elitemini",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes{instance=~\".*elitemini2.*\"} / node_memory_MemTotal_bytes{instance=~\".*elitemini2.*\"}))",
              "refId": "B",
              "legendFormat": "elitemini2",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes{instance=~\".*jetson1.*\"} / node_memory_MemTotal_bytes{instance=~\".*jetson1.*\"}))",
              "refId": "C",
              "legendFormat": "jetson1",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes{instance=~\".*jetson2.*\"} / node_memory_MemTotal_bytes{instance=~\".*jetson2.*\"}))",
              "refId": "D",
              "legendFormat": "jetson2",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 70},
                  {"color": "red", "value": 90}
                ]
              }
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
        },
        {
          "id": 3,
          "title": "Pod Status Overview",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})",
              "refId": "A",
              "legendFormat": "Running",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Pending\"})",
              "refId": "B",
              "legendFormat": "Pending",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Failed\"})",
              "refId": "C",
              "legendFormat": "Failed",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Succeeded\"})",
              "refId": "D",
              "legendFormat": "Succeeded",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "dark-gray",
                      "index": 0
                    }
                  },
                  "type": "value"
                }
              ]
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Running"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Failed"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Pending"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "yellow"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
        },
        {
          "id": 4,
          "title": "Node Status",
          "type": "stat",
          "targets": [
            {
              "expr": "kube_node_status_condition{condition=\"Ready\", status=\"true\"}",
              "refId": "A",
              "legendFormat": "{{node}} Ready",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "kube_node_status_condition{condition=\"Ready\", status=\"false\"}",
              "refId": "B",
              "legendFormat": "{{node}} NotReady",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {"color": "red", "value": 0},
                  {"color": "green", "value": 1}
                ]
              },
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 0,
                      "text": "Not Ready"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "Ready"
                    }
                  },
                  "type": "value"
                }
              ]
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
        },
        {
          "id": 5,
          "title": "ArgoCD Application Health",
          "type": "stat",
          "targets": [
            {
              "expr": "count(argocd_app_health_status{health_status=\"Healthy\"})",
              "refId": "A",
              "legendFormat": "Healthy",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "count(argocd_app_health_status{health_status=\"Degraded\"})",
              "refId": "B",
              "legendFormat": "Degraded",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "count(argocd_app_sync_status{sync_status=\"Synced\"})",
              "refId": "C",
              "legendFormat": "Synced",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "count(argocd_app_sync_status{sync_status=\"OutOfSync\"})",
              "refId": "D",
              "legendFormat": "OutOfSync",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "dark-gray",
                      "index": 0
                    }
                  },
                  "type": "value"
                }
              ]
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Healthy"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Synced"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Degraded"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "OutOfSync"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
        },
        {
          "id": 6,
          "title": "Key Services Health",
          "type": "stat",
          "targets": [
            {
              "expr": "up{job=\"prometheus\"}",
              "refId": "A",
              "legendFormat": "Prometheus",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "up{job=\"grafana\"}",
              "refId": "B",
              "legendFormat": "Grafana",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "up{job=\"kubernetes-pods\", pod=~\"ollama.*\"}",
              "refId": "C",
              "legendFormat": "Ollama",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "up{job=\"kubernetes-pods\", pod=~\".*n8n.*\"}",
              "refId": "D",
              "legendFormat": "n8n",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "up{job=\"kubernetes-pods\", pod=~\"openwebui.*\"}",
              "refId": "E",
              "legendFormat": "OpenWebUI",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "up{job=\"kubernetes-pods\", pod=~\"traefik.*\"}",
              "refId": "F",
              "legendFormat": "Traefik",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {"color": "red", "value": 0},
                  {"color": "green", "value": 1}
                ]
              },
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 0,
                      "text": "Down"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "Up"
                    }
                  },
                  "type": "value"
                }
              ]
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
        },
        {
          "id": 7,
          "title": "Resource Usage Over Time",
          "type": "timeseries",
          "targets": [
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "refId": "A",
              "legendFormat": "{{instance}} CPU %",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))",
              "refId": "B",
              "legendFormat": "{{instance}} Memory %",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": {
                "mode": "palette-classic"
              }
            }
          },
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 24}
        },
        {
          "id": 8,
          "title": "Pod Distribution by Namespace",
          "type": "table",
          "targets": [
            {
              "expr": "count by (namespace) (kube_pod_status_phase{phase=\"Running\"})",
              "refId": "A",
              "format": "table",
              "instant": true,
              "legendFormat": "Running Pods",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "displayMode": "list",
                "filterable": true,
                "align": "left"
              },
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 5},
                  {"color": "red", "value": 10}
                ]
              }
            }
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true
                },
                "indexByName": {},
                "renameByName": {
                  "namespace": "Namespace",
                  "Value": "Running Pods"
                }
              }
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32}
        },
        {
          "id": 9,
          "title": "Top CPU Using Pods",
          "type": "table",
          "targets": [
            {
              "expr": "topk(10, rate(container_cpu_usage_seconds_total{container!=\"POD\", container!=\"\"}[5m]) * 100)",
              "refId": "A",
              "format": "table",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "displayMode": "list",
                "filterable": true,
                "align": "left"
              },
              "unit": "percent"
            }
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "id": true,
                  "image": true,
                  "name": true
                },
                "indexByName": {},
                "renameByName": {
                  "pod": "Pod",
                  "namespace": "Namespace",
                  "container": "Container",
                  "Value": "CPU %"
                }
              }
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32}
        }
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "refresh": "30s",
      "version": 2,
      "uid": "kubernetes-cluster",
      "schemaVersion": 30
    }
  node-exporter.json: |
    {
      "id": null,
      "title": "Node Exporter Full",
      "tags": ["node-exporter", "prometheus"],
      "style": "dark",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "id": 1,
          "title": "CPU Usage by Node",
          "type": "timeseries",
          "targets": [
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "refId": "A",
              "legendFormat": "{{instance}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "title": "Memory Usage by Node",
          "type": "timeseries",
          "targets": [
            {
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))",
              "refId": "A",
              "legendFormat": "{{instance}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
        },
        {
          "id": 3,
          "title": "Disk Usage by Node",
          "type": "timeseries",
          "targets": [
            {
              "expr": "100 - ((node_filesystem_avail_bytes{mountpoint=\"/\"} * 100) / node_filesystem_size_bytes{mountpoint=\"/\"})",
              "refId": "A",
              "legendFormat": "{{instance}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
        },
        {
          "id": 4,
          "title": "Network I/O",
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(node_network_receive_bytes_total{device!=\"lo\"}[5m])",
