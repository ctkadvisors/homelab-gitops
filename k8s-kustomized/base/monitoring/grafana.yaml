              "expr": "jetson_power_cpu_gpu_milliwatts{instance=\"10.0.0.73:9101\"} / 1000",
              "refId": "C",
              "legendFormat": "Jetson1 CPU+GPU Power",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "jetson_power_cpu_gpu_milliwatts{instance=\"10.0.0.75:9101\"} / 1000",
              "refId": "D",
              "legendFormat": "Jetson2 CPU+GPU Power",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
