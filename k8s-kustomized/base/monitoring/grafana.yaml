                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "rate(node_network_transmit_bytes_total{device!=\"lo\"}[5m])",
              "refId": "B",
              "legendFormat": "{{instance}} - {{device}} TX",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
        }
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "refresh": "30s",
      "version": 1,
      "uid": "node-exporter-full",
      "schemaVersion": 30
    }
  jetson-ai-workloads.json: |
    {
      "id": null,
      "title": "Jetson AI Workloads",
      "tags": ["ai", "jetson", "ollama", "gpu"],
      "style": "dark",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "id": 1,
          "title": "AI Services Status",
          "type": "stat",
          "targets": [
            {
              "expr": "up{job=\"kubernetes-pods\", app=\"ollama\"}",
              "refId": "A",
              "legendFormat": "Ollama",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "up{job=\"kubernetes-pods\", app=\"openwebui\"}",
              "refId": "B",
              "legendFormat": "OpenWebUI",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {"color": "red", "value": 0},
                  {"color": "green", "value": 1}
                ]
              }
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "title": "Jetson Node Resources",
          "type": "timeseries",
          "targets": [
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\", instance=~\".*jetson.*\"}[5m])) * 100)",
              "refId": "A",
              "legendFormat": "{{instance}} CPU %",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes{instance=~\".*jetson.*\"} / node_memory_MemTotal_bytes{instance=~\".*jetson.*\"}))",
              "refId": "B",
              "legendFormat": "{{instance}} Memory %",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
