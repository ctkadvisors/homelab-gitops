          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24}
        },
        {
          "id": 8,
          "title": "Jetson Comparison Dashboard",
          "type": "stat",
          "targets": [
            {
              "expr": "jetson_gpu_utilization_percent{instance=\"10.0.0.73:9101\"}",
              "refId": "A",
              "legendFormat": "Jetson1 GPU %",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "jetson_gpu_utilization_percent{instance=\"10.0.0.75:9101\"}",
              "refId": "B",
              "legendFormat": "Jetson2 GPU %",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "jetson_gpu_temperature_celsius{instance=\"10.0.0.73:9101\"}",
              "refId": "C",
              "legendFormat": "Jetson1 Temp",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "jetson_gpu_temperature_celsius{instance=\"10.0.0.75:9101\"}",
              "refId": "D",
              "legendFormat": "Jetson2 Temp",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "jetson_memory_used_bytes{instance=\"10.0.0.73:9101\"} / jetson_memory_total_bytes{instance=\"10.0.0.73:9101\"} * 100",
              "refId": "E",
              "legendFormat": "Jetson1 Mem %",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "jetson_memory_used_bytes{instance=\"10.0.0.75:9101\"} / jetson_memory_total_bytes{instance=\"10.0.0.75:9101\"} * 100",
              "refId": "F",
              "legendFormat": "Jetson2 Mem %",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 70},
                  {"color": "red", "value": 90}
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*Temp.*"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "celsius"
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "steps": [
                        {"color": "green", "value": null},
                        {"color": "yellow", "value": 60},
                        {"color": "red", "value": 80}
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*(GPU|Mem) %.*"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  }
                ]
              }
            ]
          },
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 32}
