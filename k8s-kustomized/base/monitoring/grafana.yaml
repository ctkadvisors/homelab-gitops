      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "refresh": "30s",
      "version": 1,
      "uid": "jetson-ai-workloads",
      "schemaVersion": 30
    }
  nextjs-platform.json: |
    {
      "id": null,
      "title": "Next.js Platform Monitoring",
      "tags": ["platform", "nextjs", "builds", "deployments"],
      "style": "dark",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "id": 1,
          "title": "Platform Services Status",
          "type": "stat",
          "targets": [
            {
              "expr": "up{job=\"kubernetes-pods\", app=\"platform-api\"}",
              "refId": "A",
              "legendFormat": "Platform API",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "up{job=\"kubernetes-pods\", app=\"platform-dashboard\"}",
              "refId": "B",
              "legendFormat": "Platform Dashboard",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {"color": "red", "value": 0},
                  {"color": "green", "value": 1}
                ]
              }
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "title": "Platform Pods by Namespace",
          "type": "stat",
          "targets": [
            {
              "expr": "count by (namespace) (kube_pod_status_phase{phase=\"Running\", namespace=~\"platform.*\"})",
              "refId": "A",
              "legendFormat": "{{namespace}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              }
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
        },
        {
          "id": 3,
          "title": "Platform Resource Usage",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"platform.*\"}[5m])) by (namespace)",
              "refId": "A",
              "legendFormat": "{{namespace}} CPU",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=~\"platform.*\"}) by (namespace) / 1024 / 1024",
              "refId": "B",
              "legendFormat": "{{namespace}} Memory MB",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
        },
        {
          "id": 4,
          "title": "ArgoCD Application Health",
          "type": "table",
          "targets": [
            {
              "expr": "argocd_app_health_status",
              "refId": "A",
              "format": "table",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "displayMode": "list",
                "filterable": true
              }
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
        },
        {
          "id": 5,
          "title": "Build & Deploy Metrics (Placeholder)",
          "type": "text",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "options": {
            "content": "**Build & Deploy Metrics Coming Soon**\n\nTo enable build monitoring:\n1. Add metrics to platform-api for build events\n2. Track build duration, success/failure rates\n3. Monitor deployment frequency\n4. Track resource usage per app\n\n*Custom metrics will be added to platform-api service*"
          }
        }
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "refresh": "30s",
      "version": 1,
      "uid": "nextjs-platform",
      "schemaVersion": 30
    }
  platform-infrastructure.json: |
    {
      "id": null,
      "title": "Platform Infrastructure",
