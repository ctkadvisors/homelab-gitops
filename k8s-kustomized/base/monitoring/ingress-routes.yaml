---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus-ingress
  namespace: monitoring
  labels:
    app: prometheus
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`prometheus.example.com`)
      kind: Rule
      services:
        - name: prometheus
          port: 9090
  tls:
    secretName: example-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-ingress
  namespace: monitoring
  labels:
    app: grafana
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.example.com`)
      kind: Rule
      services:
        - name: grafana
          port: 3000
  tls:
    secretName: example-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alertmanager-ingress
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`alertmanager.example.com`)
      kind: Rule
      services:
        - name: alertmanager
          port: 9093
  tls:
    secretName: example-tls
