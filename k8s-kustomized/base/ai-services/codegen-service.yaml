---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: codegen-service
  namespace: ai-services
  labels:
    app: codegen-service
    component: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codegen-service
  template:
    metadata:
      labels:
        app: codegen-service
        component: ai-inference
    spec:
      containers:
        - name: codegen-service
          image: git.example.com/homelab/codegen-service:fast
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openrouter-secret
                  key: api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      nodeSelector:
        node-type: compute-worker # Run on x86 EliteMini2 node
      restartPolicy: Always

---

apiVersion: v1
kind: Service
metadata:
  name: codegen-service
  namespace: ai-services
  labels:
    app: codegen-service
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: codegen-service

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codegen-service-netpol
  namespace: ai-services
spec:
  podSelector:
    matchLabels:
      app: codegen-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - {} # Allow all egress for OpenRouter API calls
