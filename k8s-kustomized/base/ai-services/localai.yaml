---
# LocalAI Model Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: localai-models-config
  namespace: ai-services
  labels:
    app: localai
    app.kubernetes.io/name: localai
    app.kubernetes.io/component: ai-inference
data:
  tinyllama.yaml: |
    name: tinyllama
    backend: llama-cpp
    parameters:
      model: tinyllama-1.1b-chat.Q4_K_M.gguf
      temperature: 0.7
      context_size: 2048
      gpu_layers: 22
  nomic-embed-text.yaml: |
    name: text-embedding-ada-002
    backend: llama-cpp
    parameters:
      model: nomic-embed-text-v1.5.Q4_K_M.gguf
    embeddings: true
    gpu_layers: 99
---
# LocalAI primary (jetson1) deployment removed 2026-04-18.
# jetson1 left the K3s cluster — dedicated to bare-metal Ollama+Nemotron
# (see ollama-nemotron.yaml). LocalAI now runs single-replica on jetson2
# only (secondary deployment below).
#
# LocalAI Deployment - jetson2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localai-secondary
  namespace: ai-services
  labels:
    app: localai
    app.kubernetes.io/name: localai-secondary
    app.kubernetes.io/component: ai-inference
    app.kubernetes.io/part-of: local-ai-homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: localai
      instance: secondary
  template:
    metadata:
      labels:
        app: localai
        instance: secondary
        app.kubernetes.io/name: localai-secondary
        app.kubernetes.io/component: ai-inference
    spec:
      nodeSelector:
        kubernetes.io/hostname: jetson2
      runtimeClassName: nvidia
      securityContext:
        fsGroup: 1000
      containers:
        - name: localai
          image: docker.io/localai/localai:latest-nvidia-l4t-arm64
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              ./local-ai backends install localai@nvidia-l4t-arm64-llama-cpp && exec ./local-ai
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: LOCALAI_THREADS
              value: "6"
            - name: DEBUG
              value: "true"
          resources:
            requests:
              memory: "3Gi"
              cpu: "1000m"
              nvidia.com/gpu: "1"
            limits:
              memory: "7Gi"
              cpu: "3000m"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: backends
              mountPath: /backends
            - name: model-config
              mountPath: /models/tinyllama.yaml
              subPath: tinyllama.yaml
            - name: model-config
              mountPath: /models/nomic-embed-text.yaml
              subPath: nomic-embed-text.yaml
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: shm
              mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
        - name: model-manager
          image: git.example.com/homelab/model-manager:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: manager
          env:
            - name: NODE_NAME
              value: "jetson2"
            - name: MODELS_PATH
              value: "/models"
            - name: LOCALAI_URL
              value: "http://localhost:8080"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: models
              mountPath: /models
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: models
          hostPath:
            path: /opt/localai-models
            type: DirectoryOrCreate
        - name: backends
          hostPath:
            path: /opt/localai-backends
            type: DirectoryOrCreate
        - name: model-config
          configMap:
            name: localai-models-config
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
# Model Manager Service (jetson2 only — jetson1 removed from cluster 2026-04-18)
apiVersion: v1
kind: Service
metadata:
  name: model-manager-jetson2
  namespace: ai-services
  labels:
    app: model-manager
    node: jetson2
spec:
  selector:
    app: localai
    instance: secondary
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  type: ClusterIP
---
# LocalAI Service - Load balances across both Jetson nodes
apiVersion: v1
kind: Service
metadata:
  name: localai
  namespace: ai-services
  labels:
    app: localai
    app.kubernetes.io/name: localai
    app.kubernetes.io/component: ai-inference
spec:
  selector:
    app: localai
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
