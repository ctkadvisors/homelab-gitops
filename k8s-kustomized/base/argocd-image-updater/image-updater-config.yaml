apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  labels:
    app.kubernetes.io/name: argocd-image-updater-config
    app.kubernetes.io/part-of: argocd-image-updater
data:
  # ArgoCD Image Updater configuration
  config.yaml: |
    # ArgoCD configuration
    argocd:
      server_addr: "argocd-server:443"
      insecure: false
      plaintext: false
      token: ""
      
    # Registry configurations
    registries:
      - name: gitea-registry
        api_url: https://git.example.com
        ping: true
        insecure: false
        credentials: secret:argocd/gitea-registry-secret#username,secret:argocd/gitea-registry-secret#password
        
    # Global settings
    git:
      user: "argocd-image-updater[bot]"
      email: "noreply@argocd.argoproj.io"
      
    # Update strategy
    update:
      method: git
      
    # Logging configuration
    log:
      level: info
      format: text

  # Registry configurations for specific registries
  registries.conf: |
    registries.conf version = "1.0.0"

    registries = [
      "git.example.com"
    ]

    # Gitea registry configuration
    [[registry]]
      prefix = "git.example.com"
      location = "git.example.com"
      insecure = false
      blocked = false
      mirror = []
      
      [[registry.mirror]]
        location = "git.example.com"
        insecure = false
