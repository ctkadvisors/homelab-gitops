---
apiVersion: v1
kind: Service
metadata:
  name: traefik-loadbalancer
  namespace: ingress-system
  labels:
    app: traefik
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: loadbalancer
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: 443
      protocol: TCP
