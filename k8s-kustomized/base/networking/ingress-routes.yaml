---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openwebui-ingress
  namespace: ai-services
  labels:
    app: openwebui
    app.kubernetes.io/name: openwebui
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`chat.example.com`)
      kind: Rule
      services:
        - name: openwebui
          port: 8080
  tls:
    secretName: example-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openwebui-ip-ingress
  namespace: ai-services
  labels:
    app: openwebui
    app.kubernetes.io/name: openwebui
    app.kubernetes.io/component: ingress-fallback
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`10.0.0.200`)
      kind: Rule
      services:
        - name: openwebui
          port: 8080
  tls:
    secretName: example-tls
---
