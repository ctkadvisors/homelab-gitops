---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard-ingress
  namespace: ingress-system
  labels:
    app: traefik
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: dashboard-ingress
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.example.com`)
      kind: Rule
      services:
        - name: traefik
          port: 8080
      middlewares:
        - name: traefik-dashboard-redirect
  tls:
    secretName: example-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-redirect
  namespace: ingress-system
  labels:
    app: traefik
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: middleware
spec:
  redirectRegex:
    regex: ^https://traefik\.example\.io/?$
    replacement: https://traefik.example.com/dashboard/
