apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-ingress-from-search-namespace
  namespace: search
  labels:
    app: opensearch
spec:
  podSelector:
    matchLabels:
      app: opensearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 9600
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-memory-mcp-egress
  namespace: search
  labels:
    app: agent-memory-mcp
spec:
  podSelector:
    matchLabels:
      app: agent-memory-mcp
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: opensearch
      ports:
        - protocol: TCP
          port: 9200
