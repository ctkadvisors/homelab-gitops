apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-webhook-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
data:
  # Webhook configuration for automatic sync triggers
  webhook.github.secret: ""  # To be set manually
  
  # ArgoCD server configuration for webhooks
  url: "https://argocd.example.com"
  
  # Repository webhook configuration
  repositories: |
    - url: https://github.com/ctkadvisors/new_localai
      webhook.github.secret: REDACTED
      
    - url: git@github.com:ctkadvisors/new_localai.git
      webhook.github.secret: REDACTED
---

# Service for webhook ingress
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-webhook
  namespace: argocd
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
spec:
  ports:
  - name: webhook
    port: 443
    protocol: TCP
    targetPort: 8080
  selector:
    app.kubernetes.io/name: argocd-server
  type: ClusterIP
---

# Ingress for webhook endpoint
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-webhook-ingress
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Allow webhook traffic without authentication
    traefik.ingress.kubernetes.io/router.middlewares: "argocd-webhook-headers@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argocd-webhook.example.com
      secretName: example-tls # reflector-replicated wildcard from ingress-system (docs/runbooks/tls-wildcard.md)
  rules:
    - host: argocd-webhook.example.com
      http:
        paths:
          - path: /api/webhook
            pathType: Prefix
            backend:
              service:
                name: argocd-server-webhook
                port:
                  number: 443
---

# Middleware to add required headers for webhook
apiVersion: traefik.io/v1alpha1 # containo.us CRDs removed in Traefik v3
kind: Middleware
metadata:
  name: argocd-webhook-headers
  namespace: argocd
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
      X-Forwarded-For: ""
    customResponseHeaders:
      X-Frame-Options: "DENY"
      X-Content-Type-Options: "nosniff"