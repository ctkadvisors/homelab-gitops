apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-gateway
  namespace: argocd
  labels:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/part-of: ai-services
spec:
  project: default
  source:
    # Moved off cluster-local Gitea 2026-08-29 so a cluster rebuild does not
    # depend on the cluster's own Gitea being up. Auth: read-only deploy key
    # in secret argocd/repo-github-ai-gateway.
    repoURL: git@github.com:ctkadvisors/ai-gateway.git
    targetRevision: main
    path: k8s/overlays/k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10

