apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: argocd-production

namespace: argocd

resources:
  - ../../../base/argocd

patches:
  # Production-specific patches
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: argocd-server

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: argocd-repo-server

  # Resource limits for production
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    target:
      kind: Deployment
      name: argocd-server

  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
    target:
      kind: Deployment
      name: argocd-repo-server

  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    target:
      kind: Deployment
      name: argocd-application-controller

  # Pin all ArgoCD components to elitemini, the k3s control-plane/master.
  #
  # History: these were pinned to the isolated reconciler node (Mac mini
  # Multipass ARM64 VM, k3s-reconciler) to avoid co-failing with
  # elitemini2's gaming reboots. That backfired — the Mac VM is the
  # LEAST reliable host (power/sleep/macOS-updates + DHCP churn strand it,
  # taking ALL of ArgoCD down with it; see the 2026-06-05 outage). Pinning
  # to elitemini has no downside: it is the single k3s master, so if it is
  # down the apiserver is down and nothing reconciles anywhere regardless
  # of where ArgoCD runs. Co-locating with the control plane removes a
  # failure mode instead of adding one. (Real HA later needs a second
  # always-on Linux node + redis-ha + anti-affinity; elitemini2's Windows
  # dual-boot disqualifies it today.)
  - patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: elitemini
    target:
      kind: Deployment
      name: argocd-server

  - patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: elitemini
    target:
      kind: Deployment
      name: argocd-repo-server

  - patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: elitemini
    target:
      kind: StatefulSet
      name: argocd-application-controller

  - patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: elitemini
    target:
      kind: Deployment
      name: argocd-redis

  - patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: elitemini
    target:
      kind: Deployment
      name: argocd-applicationset-controller

  - patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: elitemini
    target:
      kind: Deployment
      name: argocd-dex-server

  - patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: elitemini
    target:
      kind: Deployment
      name: argocd-notifications-controller

labels:
  - pairs:
      environment: production
      app.kubernetes.io/instance: argocd-production
