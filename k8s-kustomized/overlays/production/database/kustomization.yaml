---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: database

resources:
  - ../../../base/database

patches:
  - path: postgresql-elitemini.yaml
  # Ensure PostgreSQL runs on EliteMini control plane
  - target:
      kind: Deployment
      name: postgresql
    patch: |-
      - op: replace
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/control-plane: "true"
      - op: add
        path: /spec/template/spec/tolerations
        value: []
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: In
                  values:
                  - "true"
