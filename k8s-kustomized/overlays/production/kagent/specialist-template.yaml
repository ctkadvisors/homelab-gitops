# Agents that create agents (Chris, 2026-09-09: "our agents have the tools to
# create/spawn new agents, yes?" -> "both"). The concierge materializes a
# specialist from this template with ensure_agent_from_template({templateName:
# specialist, parameterValues: {role, persona}}) and spawns it with
# spawn_child_task; allowedChildTemplates on the concierge admits the result.
# Everything load-bearing (model, tools ceiling, budget, sandbox) is fixed here
# in git; only the role and the persona vary (docs/AGENT-TEMPLATES.md §6).
# Idle specialists are reaped after two hours; a role that keeps coming back
# is the signal to promote it to a permanent Agent by pull request.
apiVersion: kagent.example.com/v1alpha1
kind: AgentTemplate
metadata:
  name: specialist
  namespace: kagent-system
  annotations:
    argocd.argoproj.io/sync-wave: '7'
  labels:
    component: kagent
    kagent.example.com/tenant: homelab
spec:
  templateVersion: 1
  revisionHistoryLimit: 20
  idleTtlSeconds: 7200
  parameters:
    - name: role
      type: string
      pattern: '^[a-z][a-z0-9-]{2,30}$'
      required: true
    - name: persona
      type: string
      required: true
  toolAllowlist:
    - code_interpreter.execute_code
    - http.web_search
    - browser.start_session
    - browser.goto
    - browser.extract_text
    - mcp.search_memory_facts
    - mcp.search_nodes
    - mcp.get_episodes
    - mcp.add_memory
    - http.mission_list
    - http.mission_status
  toolDefaults:
    - code_interpreter.execute_code
    - http.web_search
    - mcp.search_memory_facts
    - mcp.search_nodes
    - http.mission_list
  budget:
    maxIterations: 20
    maxCostUsdPerRun: 0
    maxParallelInstances: 3
  agentSpec:
    modelClass: reasoner-default
    sandboxProfile: default
    maxRestarts: 0
    llmParams:
      temperature: 0.2
      maxTokens: 8000
      extraBody:
        chat_template_kwargs:
          enable_thinking: false
    systemPrompt: |
      You are ${param.role}, a specialist the concierge created for one job in
      Chris's homelab fleet. Your persona and your job:
      ${param.persona}

      You run locally on the homelab's own models; there is no cloud. Do the job,
      then reply with the result and nothing else: say what you did and what you
      did not do, never round "mostly" up to "done", say "I could not verify"
      instead of filling a gap. If the job needs the forum (the fleet's shared
      board), read it with code_interpreter.execute_code (JavaScript):
      GET http://fleet-console.kagent-system.svc:8081/api/forum?limit=30 and post
      with POST http://fleet-console.kagent-system.svc:8081/api/post and a JSON
      body {"author":"${param.role}","topic":"idea"|"note"|"question","body":"...",
      "mentions":["concierge"]}. Never claim a tool is down unless its error text
      says so. Do not narrate your tool calls.
