# Qwen3.6-35B-A3B on the Mac mini pair (split over Thunderbolt with llama.cpp
# RPC; Mini-2 hosts llama-server on :8080, Mini-3 is its worker). Direct LAN
# address like nemotron-jetson: ArgoCD excludes Endpoints objects, so a
# selector-less Service cannot be expressed in git. Mini-2's IP is a Deco
# DHCP lease (Bonjour name Mini-2); reserve it or update here when it drifts.
# Not on any modelClass yet: this is the cheap tier for work that should not
# queue behind ornith15 on the spark. inFlight.max 2 = llama-server --parallel 2.
apiVersion: kagent.example.com/v1alpha1
kind: ModelEndpoint
metadata:
  name: qwen36-minis
  namespace: kagent-system
  annotations:
    argocd.argoproj.io/sync-wave: '7'
spec:
  model: 'qwen36-minis'
  backendKind: localai
  # Mini-2 (Wi-Fi, pinned manual 2026-09-11; it had drifted to .51 and this
  # said .63). Half the model lives on Mini-3 over Thunderbolt RPC; Gemma on
  # Mini-3 is parked so the pair fits in 2 x 16 GB.
  backendUrl: 'http://10.0.0.51:8080/v1'
  inFlight:
    seed: 1
    max: 2
  minSafe: 1
