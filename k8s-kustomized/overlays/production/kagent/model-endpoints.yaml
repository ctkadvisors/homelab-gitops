# Cloudflare AI Gateway → workers-ai/@cf/meta/llama-3.3-70b-instruct-fp8-fast
# via the same OpenAI-compat multi-provider proxy path as the scout
# endpoint above. Added for the v0.1.9-rc.1 rc-spectrum bundle which
# pairs scout + 70B head-to-head (examples/rc-spectrum/40-model-
# compare-scout.yaml + 41-model-compare-llama70.yaml). The 70B model
# is the documented fallback in docs/V0.1-COMPARISON.md and
# docs/HARNESS-LESSONS.md when scout's tool-call shape regresses;
# rc-spectrum exercises it as a first-class peer rather than a
