# The ruler for harness changes (Chris, 2026-09-09: "test for success,
# quantifiable, incremental improvement, with each change"). A suspended
# CronJob that is only ever a template: run it by hand, once per label, before
# and after a change, and compare (scripts/bench.py).
#
#   kubectl create job -n kagent-system --from=cronjob/fleet-bench bench-<label>
#   kubectl exec -n kagent-system deploy/mission-launcher -- python3 /app/scripts/bench.py --compare baseline <label>
#
# Mission-shaped on purpose (label app: mission, SA fleet-stage, the same
# mounts and env): the bench runs the real stage.sh, the real dsh patch, the
# real model, on three fixed fixtures. Never scheduled.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fleet-bench
  namespace: kagent-system
  labels:
    app: mission
spec:
  schedule: "0 0 31 2 *"   # never (Feb 31); create jobs from it by hand
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: mission
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 5400
      ttlSecondsAfterFinished: 43200
      template:
        metadata:
          labels:
            app: mission
        spec:
          restartPolicy: Never
          serviceAccountName: fleet-stage
          securityContext: { runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001 }
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/arch: amd64
          initContainers:
            - name: init-cache
              image: busybox:1.36
              command: ["sh", "-c", "mkdir -p /cache/npm /cache/pip /cache/uv && chown -R 1001:1001 /cache"]
              securityContext: { runAsUser: 0, runAsGroup: 0 }
              resources: { limits: { cpu: 100m, memory: 32Mi }, requests: { cpu: 5m, memory: 8Mi } }
              volumeMounts: [{ name: cache, mountPath: /cache }]
            - name: scripts
              image: git.example.com/homelab/fleet-scripts:20260916-366f92e
              command: ["sh", "-c", "cp -r /app/. /fleet/"]
              resources: { limits: { cpu: 200m, memory: 128Mi }, requests: { cpu: 10m, memory: 32Mi } }
              volumeMounts: [{ name: fleet, mountPath: /fleet }]
          containers:
            - name: bench
              image: git.example.com/homelab/agent-coder:20260830
              command: ["python3", "/fleet/scripts/bench.py", "--held-out"]   # the held-out fixture too: the reviewer needs a baseline (2026-09-10)
              env:
                - { name: OPENAI_API_KEY, value: local }
                - { name: DSH_PERMISSION_MODE, value: danger-full-access }
                - { name: npm_config_cache, value: /workspace/cache/npm }
                - { name: PIP_CACHE_DIR, value: /workspace/cache/pip }
                - { name: UV_CACHE_DIR, value: /workspace/cache/uv }
                - { name: LEDGER_DSN_FILE, value: /secrets/ledger/dsn }
                - { name: BENCH_STAGE_TIMEOUT, value: "900" }
                - name: JOB_NAME
                  valueFrom: { fieldRef: { fieldPath: "metadata.labels['job-name']" } }
              resources:
                requests: { memory: "512Mi", cpu: "250m" }
                limits: { memory: "8Gi", cpu: "2000m" }
              volumeMounts:
                - { name: config, mountPath: /config, readOnly: true }
                - { name: fleet, mountPath: /fleet, readOnly: true }
                - { name: workspace, mountPath: /workspace }
                - { name: cache, mountPath: /workspace/cache }
                - { name: ledger, mountPath: /secrets/ledger, readOnly: true }
          volumes:
            - name: config
              configMap: { name: improve-daily }
            - name: fleet
              emptyDir: {}
            - name: workspace
              emptyDir: {}
            - name: cache
              hostPath: { path: /var/lib/fleet-cache, type: DirectoryOrCreate }
            - name: ledger
              secret: { secretName: fleet-ledger-dsn, optional: true }
